name: Programador de Efemérides en X

on:
  schedule:
    # Se ejecuta a las 08:40 AM hora de Argentina (UTC-3), que equivale a las 11:40 AM UTC
    - cron: '40 11 9 8 *'
  workflow_dispatch: # Permite ejecutarlo manualmente si se desea probar

jobs:
  publicar-efemerides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install tweepy

      - name: Ejecutar script de publicación de efemérides
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        run: |
          python programar_tweets_cloud.py
